<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유용한 기능</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Malgun Gothic', sans-serif;
      background: #f0f0f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .top-nav {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      padding: 10px 16px 0;
      background: #1e1e2e;
      flex-shrink: 0;
    }
    .top-tab {
      width: 200px;
      text-align: center;
      white-space: nowrap;
      padding: 10px 16px;
      border: none;
      border-radius: 8px 8px 0 0;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Malgun Gothic', sans-serif;
      cursor: pointer;
      background: #2e2e42;
      color: #aaa;
      transition: background 0.15s, color 0.15s;
    }
    .top-tab:hover { background: #3a3a55; color: #ddd; }
    .top-tab.active { background: #f0f0f0; color: #1e1e2e; }
    /* 오른쪽 끝 업데이트 버튼 */
    .nav-update {
      margin-left: auto;
      margin-bottom: 6px;
      white-space: nowrap;
      padding: 9px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Malgun Gothic', sans-serif;
      cursor: pointer;
      color: #dbf1ec;
      background: #2f6a60;
      transition: background 0.15s, opacity 0.15s;
    }
    .nav-update:hover { background: #276057; }
    .panel { display: none; flex: 1; overflow: hidden; }
    .panel.active { display: flex; flex-direction: column; }
    .panel iframe { width: 100%; flex: 1; border: none; }
    .warn-banner {
      text-align: center;
      background: #2d0a0a;
      color: #f87171;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 20px;
      flex-shrink: 0;
    }
    /* 오른쪽 아래 결과 알림 (자동으로 안 사라짐 — × 눌러야 닫힘) */
    .status-card {
      position: fixed;
      right: 20px;
      bottom: 20px;
      max-width: 360px;
      padding: 16px 46px 14px 18px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
      box-shadow: 0 6px 24px rgba(0,0,0,0.35);
      display: none;
      z-index: 9999;
    }
    .status-card.show { display: block; }
    .status-card.ok  { background: #12352f; color: #d7f2ee; border-left: 4px solid #2f6a60; }
    .status-card.err { background: #3a1414; color: #ffd9d5; border-left: 4px solid #b3453b; }
    .status-card.wait{ background: #23233a; color: #dfe3f0; border-left: 4px solid #5b6bb0; }
    .status-card .st-title { font-weight: 700; margin-bottom: 4px; }
    .status-card .st-time { font-size: 12px; opacity: 0.7; margin-top: 8px; }
    .status-card .st-close {
      position: absolute; top: 8px; right: 10px;
      background: none; border: none; color: inherit;
      font-size: 20px; line-height: 1; cursor: pointer; opacity: 0.6;
    }
    .status-card .st-close:hover { opacity: 1; }
  </style>
</head>
<body>
  <nav class="top-nav">
    <button class="top-tab active" id="tabIr" onclick="switchTab('ir')">🖼 이미지 자동 리사이저</button>
    <button class="top-tab" id="tabAd" onclick="switchTab('ad')">🔐 광고주 계정</button>
    <button class="top-tab" id="tabSp" onclick="switchTab('sp')">🔍 subparam 변환</button>
    <button class="top-tab" id="tabTv" onclick="switchTab('tv')">🔗 트래킹 링크 검증</button>
    <button class="nav-update" id="btnUpdate" onclick="updateCamps()">🔄 4개 서버 업데이트</button>
  </nav>
  <div class="panel active" id="panelIr">
    <iframe src="resizer.html" title="이미지 자동 리사이저" allow="clipboard-write"></iframe>
  </div>
  <div class="panel" id="panelAd">
    <iframe src="https://script.google.com/macros/s/AKfycbw9Na11j57J6TId3-hXBONDk6P-OqPQghP-iJ7DZz1lcRfPqSIFe2c56qfM9pgWZiPW/exec" title="광고주 계정" allow="clipboard-write"></iframe>
  </div>
  <div class="panel" id="panelTv">
    <div class="warn-banner">※ URL 직접 분석 필요 / 트래커 링크 검증은 숙련 후 사용 권장</div>
    <iframe src="tracker.html" title="트래킹 링크 검증" allow="clipboard-write"></iframe>
  </div>
  <div class="panel" id="panelSp">
    <iframe src="subparam.html" title="subparam 변환"></iframe>
  </div>

  <div id="statusCard" class="status-card">
    <button class="st-close" onclick="closeStatus()" title="닫기">×</button>
    <div id="statusBody"></div>
  </div>

  <script>
    function switchTab(name) {
      document.querySelectorAll('.top-tab').forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function (p) { p.classList.remove('active'); });
      var cap = name.charAt(0).toUpperCase() + name.slice(1);
      document.getElementById('tab' + cap).classList.add('active');
      document.getElementById('panel' + cap).classList.add('active');
    }

    var statusHideTimer = null;

    function closeStatus() {
      clearTimeout(statusHideTimer);
      document.getElementById('statusCard').classList.remove('show');
    }

    // 탭이 "화면에 보이는 동안"만 카운트다운 → 8초 뒤 자동으로 닫힘.
    // 다른 탭으로 가거나 창을 내리면(숨김) 멈추고, 이 탭으로 돌아오면 그때부터 다시 8초.
    // ※ visibility는 iframe 포커스에 영향받지 않아서 안정적임 (기존 hasFocus 버그 해결).
    function armAutoHide() {
      clearTimeout(statusHideTimer);
      var card = document.getElementById('statusCard');
      if (card.classList.contains('show') && document.visibilityState === 'visible') {
        statusHideTimer = setTimeout(closeStatus, 8000); // 8초 뒤 자동으로 닫힘
      }
    }
    document.addEventListener('visibilitychange', armAutoHide);

    function showStatus(kind, title, sub) {
      var now = new Date();
      var hh = ('0' + now.getHours()).slice(-2);
      var mm = ('0' + now.getMinutes()).slice(-2);
      document.getElementById('statusBody').innerHTML =
        '<div class="st-title">' + title + '</div>' +
        (sub ? sub : '') +
        '<div class="st-time">🕒 ' + hh + ':' + mm + ' · 보시면 잠시 후 자동으로 닫혀요</div>';
      document.getElementById('statusCard').className = 'status-card show ' + kind;
      armAutoHide();
    }

    // 호출 대상 (원래 8080 / 크롬 정책상 앞으로 4430 예정 → 바꿀 땐 아래 두 줄만 수정)
    var CALL_PROTO = 'http';   // 8080이면 'http', 4430이면 'https'
    var CALL_PORT = 8080;      // 4430으로 바꿀 땐 → 'https', 4430

    function updateCamps() {
      var ips = ['50', '51', '52', '53'];
      // [검증용] 각 서버 URL을 새 탭(팝업)으로 열어 → 실제 응답(1=성공 / 0=실패)을 눈으로 확인
      // 팝업(페이지 이동)은 크롬 mixed-content 차단을 안 받으므로 http여도 열림.
      var blocked = false;
      ips.forEach(function (n) {
        var url = CALL_PROTO + '://183.110.238.' + n + ':' + CALL_PORT + '/cmd?update_camp';
        var w = window.open(url, '_blank');
        if (!w) { blocked = true; }
      });

      if (blocked) {
        showStatus('err', '⚠️ 팝업이 차단됐어요',
          '주소창 오른쪽 팝업 아이콘 → "항상 허용" 으로 바꾼 뒤 다시 눌러주세요.');
      } else {
        showStatus('ok', '✅ 4개 서버 탭 열림',
          '각 탭에서 응답값(1=성공 / 0=실패)을 확인하세요.');
      }
    }
  </script>
</body>
</html>
