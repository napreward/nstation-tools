<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유용한 기능</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Malgun Gothic', sans-serif;
      background: #f0f0f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .top-nav {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      padding: 10px 16px 0;
      background: #1e1e2e;
      flex-shrink: 0;
    }
    .top-tab {
      width: 200px;
      text-align: center;
      white-space: nowrap;
      padding: 10px 16px;
      border: none;
      border-radius: 8px 8px 0 0;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Malgun Gothic', sans-serif;
      cursor: pointer;
      background: #2e2e42;
      color: #aaa;
      transition: background 0.15s, color 0.15s;
    }
    .top-tab:hover { background: #3a3a55; color: #ddd; }
    .top-tab.active { background: #f0f0f0; color: #1e1e2e; }
    /* 오른쪽 끝 업데이트 버튼 */
    .nav-update {
      margin-left: auto;
      margin-bottom: 6px;
      white-space: nowrap;
      padding: 9px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Malgun Gothic', sans-serif;
      cursor: pointer;
      color: #dbf1ec;
      background: #2f6a60;
      transition: background 0.15s, opacity 0.15s;
    }
    .nav-update:hover { background: #276057; }
    .panel { display: none; flex: 1; overflow: hidden; }
    .panel.active { display: flex; flex-direction: column; }
    .panel iframe { width: 100%; flex: 1; border: none; }
    .warn-banner {
      text-align: center;
      background: #2d0a0a;
      color: #f87171;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 20px;
      flex-shrink: 0;
    }
    /* 오른쪽 아래 결과 알림 (자동으로 안 사라짐 — × 눌러야 닫힘) */
    .status-card {
      position: fixed;
      right: 20px;
      bottom: 20px;
      max-width: 360px;
      padding: 16px 46px 14px 18px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
      box-shadow: 0 6px 24px rgba(0,0,0,0.35);
      display: none;
      z-index: 9999;
    }
    .status-card.show { display: block; }
    .status-card.ok  { background: #12352f; color: #d7f2ee; border-left: 4px solid #2f6a60; }
    .status-card.err { background: #3a1414; color: #ffd9d5; border-left: 4px solid #b3453b; }
    .status-card.wait{ background: #23233a; color: #dfe3f0; border-left: 4px solid #5b6bb0; }
    .status-card .st-title { font-weight: 700; margin-bottom: 4px; }
    .status-card .st-time { font-size: 12px; opacity: 0.7; margin-top: 8px; }
    .status-card .st-close {
      position: absolute; top: 8px; right: 10px;
      background: none; border: none; color: inherit;
      font-size: 20px; line-height: 1; cursor: pointer; opacity: 0.6;
    }
    .status-card .st-close:hover { opacity: 1; }
  </style>
</head>
<body>
  <nav class="top-nav">
    <button class="top-tab active" id="tabIr" onclick="switchTab('ir')">🖼 이미지 자동 리사이저</button>
    <button class="top-tab" id="tabAd" onclick="switchTab('ad')">🔐 광고주 계정</button>
    <button class="top-tab" id="tabSp" onclick="switchTab('sp')">🔍 subparam 변환</button>
    <button class="top-tab" id="tabTv" onclick="switchTab('tv')">🔗 트래킹 링크 검증</button>
    <button class="nav-update" id="btnUpdate" onclick="updateCamps()">🔄 4개 서버 업데이트</button>
  </nav>
  <div class="panel active" id="panelIr">
    <iframe src="resizer.html" title="이미지 자동 리사이저" allow="clipboard-write"></iframe>
  </div>
  <div class="panel" id="panelAd">
    <iframe src="https://script.google.com/macros/s/AKfycbw9Na11j57J6TId3-hXBONDk6P-OqPQghP-iJ7DZz1lcRfPqSIFe2c56qfM9pgWZiPW/exec" title="광고주 계정" allow="clipboard-write"></iframe>
  </div>
  <div class="panel" id="panelTv">
    <div class="warn-banner">※ URL 직접 분석 필요 / 트래커 링크 검증은 숙련 후 사용 권장</div>
    <iframe src="tracker.html" title="트래킹 링크 검증" allow="clipboard-write"></iframe>
  </div>
  <div class="panel" id="panelSp">
    <iframe src="subparam.html" title="subparam 변환"></iframe>
  </div>

  <div id="statusCard" class="status-card">
    <button class="st-close" onclick="closeStatus()" title="닫기">×</button>
    <div id="statusBody"></div>
  </div>

  <script>
    function switchTab(name) {
      document.querySelectorAll('.top-tab').forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function (p) { p.classList.remove('active'); });
      var cap = name.charAt(0).toUpperCase() + name.slice(1);
      document.getElementById('tab' + cap).classList.add('active');
      document.getElementById('panel' + cap).classList.add('active');
    }

    var statusHideTimer = null;
    var UPDATE_TIMEOUT_MS = 600000; // 서버 응답 최대 대기 ≈ 10분 (트래픽 많을 때 5분40초+ 대비)

    function closeStatus() {
      clearTimeout(statusHideTimer);
      document.getElementById('statusCard').classList.remove('show');
    }

    // 사용자가 페이지를 "실제로 보고 있을 때만" 카운트다운 → 보고 나면 자동으로 닫힘.
    // 자리를 비운 동안(탭 숨김 / 창 포커스 아웃)엔 안 사라지고 그대로 남아있음.
    function armAutoHide() {
      clearTimeout(statusHideTimer);
      var card = document.getElementById('statusCard');
      if (!card.classList.contains('show')) return;
      if (document.visibilityState === 'visible' && document.hasFocus()) {
        statusHideTimer = setTimeout(closeStatus, 7000); // 7초 보고 나면 사라짐
      }
    }
    document.addEventListener('visibilitychange', armAutoHide); // 탭 다시 보이면
    window.addEventListener('focus', armAutoHide);              // 창 다시 포커스되면
    window.addEventListener('blur', function () { clearTimeout(statusHideTimer); }); // 자리 비우면 정지

    function showStatus(kind, title, sub) {
      var now = new Date();
      var hh = ('0' + now.getHours()).slice(-2);
      var mm = ('0' + now.getMinutes()).slice(-2);
      document.getElementById('statusBody').innerHTML =
        '<div class="st-title">' + title + '</div>' +
        (sub ? sub : '') +
        '<div class="st-time">🕒 ' + hh + ':' + mm + ' · 보시면 잠시 후 자동으로 닫혀요</div>';
      document.getElementById('statusCard').className = 'status-card show ' + kind;
      armAutoHide();
    }

    function updateCamps() {
      var ips = ['50', '51', '52', '53'];
      var btn = document.getElementById('btnUpdate');
      var orig = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '⏳ 처리 중...';
      closeStatus(); // 진행 중엔 알림 안 보여줌 (버튼만 ⏳)

      // 서버가 처리를 끝내면 GET 응답이 돌아옴 → 그 순간(=진짜 완료)에 알림.
      // no-cors라 응답 '본문'은 못 읽지만, "응답이 왔다=처리 끝"은 알 수 있음.
      // (본문값으로 성공/실패까지 구분하려면 서버에 CORS 헤더 필요)
      var done = 0;
      var failFast = []; // 5초 내 즉시 실패 = 요청이 안 나감(차단/거부)
      var failSlow = []; // 처리 중 실패 / 시간초과
      var t0 = Date.now();

      ips.forEach(function (n) {
        var url = 'http://183.110.238.' + n + ':8080/cmd?update_camp';
        var ctrl = new AbortController();
        var timer = setTimeout(function () { ctrl.abort(); }, UPDATE_TIMEOUT_MS);
        fetch(url, { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal })
          .catch(function () {
            if (Date.now() - t0 < 5000) { failFast.push(n); } else { failSlow.push(n); }
          })
          .finally(function () {
            clearTimeout(timer);
            done++;
            if (done === ips.length) {
              btn.disabled = false;
              btn.innerHTML = orig;
              if (failFast.length === ips.length) {
                showStatus('err', '⚠️ 요청이 전송되지 않았어요',
                  '크롬 "안전하지 않은 콘텐츠" 허용을 확인하세요.<br>' +
                  '(주소창 왼쪽 아이콘 → 사이트 설정 → 허용 → 새로고침)');
              } else if (failFast.length + failSlow.length > 0) {
                var bad = failFast.concat(failSlow).sort();
                showStatus('err', '⚠️ 일부 서버 실패 / 시간초과',
                  bad.map(function (x) { return '· 183.110.238.' + x; }).join('<br>') +
                  '<br>개발팀에 문의하세요.');
              } else {
                showStatus('ok', '✅ 업데이트 완료',
                  '4대 서버 처리가 끝났어요. 화면을 확인해 주세요.');
              }
            }
          });
      });
    }
  </script>
</body>
</html>
