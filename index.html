<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유용한 기능</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Malgun Gothic', sans-serif;
      background: #f0f0f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .top-nav {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      padding: 10px 16px 0;
      background: #1e1e2e;
      flex-shrink: 0;
    }
    .top-tab {
      width: 200px;
      text-align: center;
      white-space: nowrap;
      padding: 10px 16px;
      border: none;
      border-radius: 8px 8px 0 0;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Malgun Gothic', sans-serif;
      cursor: pointer;
      background: #2e2e42;
      color: #aaa;
      transition: background 0.15s, color 0.15s;
    }
    .top-tab:hover { background: #3a3a55; color: #ddd; }
    .top-tab.active { background: #f0f0f0; color: #1e1e2e; }
    /* 오른쪽 끝 업데이트 버튼 */
    .nav-update {
      margin-left: auto;
      margin-bottom: 6px;
      white-space: nowrap;
      padding: 9px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Malgun Gothic', sans-serif;
      cursor: pointer;
      color: #dbf1ec;
      background: #2f6a60;
      transition: background 0.15s, opacity 0.15s;
    }
    .nav-update:hover { background: #276057; }
    .panel { display: none; flex: 1; overflow: hidden; }
    .panel.active { display: flex; flex-direction: column; }
    .panel iframe { width: 100%; flex: 1; border: none; }
    .warn-banner {
      text-align: center;
      background: #2d0a0a;
      color: #f87171;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 20px;
      flex-shrink: 0;
    }
    /* 오른쪽 아래 안내 알림 */
    .up-toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      max-width: 300px;
      background: #1e1e2e;
      color: #eee;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.7;
      box-shadow: 0 6px 24px rgba(0,0,0,0.35);
      display: none;
      z-index: 9999;
    }
    .up-toast.show { display: block; }
    .up-toast .up-toast-title { font-weight: 700; margin-bottom: 4px; }
  </style>
</head>
<body>
  <nav class="top-nav">
    <button class="top-tab active" id="tabIr" onclick="switchTab('ir')">🖼 이미지 자동 리사이저</button>
    <button class="top-tab" id="tabAd" onclick="switchTab('ad')">🔐 광고주 계정</button>
    <button class="top-tab" id="tabSp" onclick="switchTab('sp')">🔍 subparam 변환</button>
    <button class="top-tab" id="tabTv" onclick="switchTab('tv')">🔗 트래킹 링크 검증</button>
    <button class="nav-update" id="btnUpdate" onclick="updateCamps()">🔄 4개 서버 업데이트</button>
  </nav>
  <div class="panel active" id="panelIr">
    <iframe src="resizer.html" title="이미지 자동 리사이저" allow="clipboard-write"></iframe>
  </div>
  <div class="panel" id="panelAd">
    <iframe src="https://script.google.com/macros/s/AKfycbw9Na11j57J6TId3-hXBONDk6P-OqPQghP-iJ7DZz1lcRfPqSIFe2c56qfM9pgWZiPW/exec" title="광고주 계정" allow="clipboard-write"></iframe>
  </div>
  <div class="panel" id="panelTv">
    <div class="warn-banner">※ URL 직접 분석 필요 / 트래커 링크 검증은 숙련 후 사용 권장</div>
    <iframe src="tracker.html" title="트래킹 링크 검증" allow="clipboard-write"></iframe>
  </div>
  <div class="panel" id="panelSp">
    <iframe src="subparam.html" title="subparam 변환"></iframe>
  </div>

  <div id="upToast" class="up-toast"></div>

  <script>
    function switchTab(name) {
      document.querySelectorAll('.top-tab').forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function (p) { p.classList.remove('active'); });
      var cap = name.charAt(0).toUpperCase() + name.slice(1);
      document.getElementById('tab' + cap).classList.add('active');
      document.getElementById('panel' + cap).classList.add('active');
    }

    function updateCamps() {
      var ips = ['50', '51', '52', '53'];
      var btn = document.getElementById('btnUpdate');
      var orig = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '⏳ 업데이트 중...';

      // 탭 안 열고 백그라운드로 4개 서버 호출 → 접속 실패 서버는 알럿
      var dead = [];
      var checked = 0;
      ips.forEach(function (n) {
        var url = 'https://183.110.238.' + n + ':4430/cmd?update_camp';
        var ctrl = new AbortController();
        var timer = setTimeout(function () { ctrl.abort(); }, 6000); // 6초 내 응답 없으면 실패로 간주
        fetch(url, { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal })
          .catch(function () { dead.push(n); })
          .finally(function () {
            clearTimeout(timer);
            checked++;
            if (checked === ips.length) {
              btn.disabled = false;
              btn.innerHTML = orig;
              if (dead.length > 0) {
                var list = dead.map(function (x) { return '  · 183.110.238.' + x; }).join('\n');
                alert('⚠️ 접속 실패 서버가 있어요!\n\n' + list +
                  '\n\n개발팀에 문의하세요.');
              } else {
                var t = document.getElementById('upToast');
                t.classList.add('show');
                t.innerHTML = '<div class="up-toast-title">✅ 4개 서버 업데이트 완료</div>';
                setTimeout(function () { t.classList.remove('show'); }, 3000);
              }
            }
          });
      });
    }
  </script>
</body>
</html>
